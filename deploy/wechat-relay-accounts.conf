# Optional drop-in for serving several Official Accounts from one relay.
# Install as /etc/systemd/system/wechat-relay.service.d/accounts.conf and
# remove WECHAT_APP_ID, WECHAT_APP_SECRET, and RELAY_TOKEN from
# /etc/wechat-relay/wechat-relay.env; the service refuses to start with both.
#
# systemd reads the root-only accounts file and exposes a copy that only this
# unit's dynamic user can read. The credentials never enter the environment.
[Service]
LoadCredential=accounts.json:/etc/wechat-relay/accounts.json
Environment=WECHAT_ACCOUNTS_FILE=%d/accounts.json
